<main class="site-listing" id="main-content" data-prompt-category="{{section}}">
	<header class="listing-header">
		<p class="eyebrow">Prompt category</p>
		<h1>{{title}}</h1>
		<p>{{description}}</p>
	</header>
	<div class="category-introduction docs-body">{{body}}</div>
	<ul class="card-grid category-results" data-category-results aria-live="polite" aria-busy="true"></ul>
	<p class="category-status" data-category-status>Loading prompts...</p>
</main>
