<main class="site-home" id="main-content">
	<section class="sk-hero home-hero" aria-labelledby="home-title">
		<div class="home-hero-copy">
			<p class="eyebrow">Curated AI prompt library</p>
			<h1 id="home-title">Prompts built for making.</h1>
			<p class="home-lede">{{description}} Curated to save time, spark creativity, and boost productivity.</p>
			<div class="home-actions"><a class="sk-button" href="#latest-prompts">Explore prompts</a><a class="sk-button sk-button--secondary" href="/contact/">Get in touch</a></div>
		</div>
		<figure class="sk-code-block prompt-window"><figcaption><span>prompt.json</span><span aria-hidden="true">● ● ●</span></figcaption><pre><code class="language-json">{
  "idea": "yours",
  "structure": "ready",
  "output": "better"
}</code></pre></figure>
	</section>
	<section class="latest-prompts" id="latest-prompts" aria-labelledby="latest-title">
		<header class="section-heading"><p class="eyebrow">The library</p><h2 id="latest-title">Latest prompts</h2></header>
		{{posts_html}}
		{{pagination}}
	</section>
</main>
